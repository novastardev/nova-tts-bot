{
  "name": "nova-tts-bot",
  "type": "python",
  "region": "oregon",
  "buildCommand": "pip install -r requirements.txt",
  "startCommand": "python3 tts_monitor.py",
  "healthCheckPath": "/api/status",
  "initialSize": "basic",
  "instances": 1,
  "restartPolicy": {
    "name": "on_failure",
    "maxRetries": 5
  }
}
